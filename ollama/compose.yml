services:
  ollama:
    image: ${OLLAMA_IMAGE}
    container_name: ollama
    restart: unless-stopped
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
      - OLLAMA_KEEP_ALIVE=10
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_CONTEXT_LENGTH=${OLLAMA_CONTEXT_LENGTH}
    volumes:
      - /home/norod/docker/ai/ollama:/root/.ollama:rw
    ports:
      - "${OLLAMA_HOST_BIND}:${OLLAMA_PORT}:11434"
      - "${TAILSCALE_IP}:${OLLAMA_PORT}:11434"
    networks:
      - ai_default
    command: serve

networks:
  ai_default:
    external: true
