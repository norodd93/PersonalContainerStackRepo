# Portainer for brick. Portainer is not managed by a Portainer stack.
# The UI binds to localhost and is published to the tailnet with:
#   tailscale serve --bg --tcp=9443 tcp://127.0.0.1:9443
# nedpi runs Portainer EE the same way. See README.md.
# Add "127.0.0.1:8000:8000" only if you use Portainer Edge Agents.
# portainer_data is pre-existing; on a fresh host create it first:
#   sudo docker volume create portainer_data

services:
  portainer:
    image: portainer/portainer-ce:lts
    container_name: portainer
    restart: always
    security_opt:
      - no-new-privileges:true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    ports:
      - "127.0.0.1:9443:9443"

volumes:
  portainer_data:
    external: true
    name: portainer_data
