servers:
  - name: nedpi
    host: 100.96.62.97
    user: norod
    key: ~/.ssh/id_ed25519
  - name: brick
    host: 100.65.227.39
    user: norod
    key: ~/.ssh/id_ed25519

notify:
  telegram:
    bot_token: <REDACTED>
    chat_id: <REDACTED>

alerts:
  cpu: 90      # adjust to taste (e.g. 85)
  memory: 90
  disk: 80
  rules:
    - name: ai-backend-recover
      metric: container
      kind: docker
      watch: [opencode-proxy, searxng]
      action: restart

watch:
  enabled: true      # once notify is configured
  notify_on: incident     # or: incident | all | off
  cooldown: 5m