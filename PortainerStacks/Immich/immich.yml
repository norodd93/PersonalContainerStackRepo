services:
  database:
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0
    container_name: immich_postgres
    restart: always
    environment:
      - POSTGRES_INITDB_ARGS=--data-checksums
      - POSTGRES_PASSWORD=ubuntu
      - POSTGRES_USER=admin
      - POSTGRES_DB=immich
      - PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/usr/lib/postgresql/14/bin
      - GOSU_VERSION=1.17
      - LANG=en_US.utf8
      - PG_MAJOR=14
      - PG_VERSION=14.19-1.pgdg12+1
      - PGDATA=/var/lib/postgresql/data
      - DB_STORAGE_TYPE=SSD
    volumes:
      - /srv/immich/ImmichDB:/var/lib/postgresql/data:rw
    networks:
      immich_default:
        aliases:
          - immich_postgres
          - database

  redis:
    image: docker.io/valkey/valkey:9
    container_name: immich_redis
    restart: always
    environment:
      - PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      - VALKEY_VERSION=9.1.2
    networks:
      immich_default:
        aliases:
          - immich_redis
          - redis

  immich-server:
    image: ghcr.io/immich-app/immich-server:v3.3.6
    container_name: immich_server
    restart: always
    environment:
      - DB_PASSWORD=ubuntu
      - DB_USERNAME=admin
      - DB_DATABASE_NAME=immich
      - UPLOAD_LOCATION=/srv/immich/ImmichUpload
      - DB_DATA_LOCATION=/srv/immich/ImmichDB
    volumes:
      - /srv/immich/ImmichUpload:/data:rw
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "127.0.0.1:2283:2283"
    networks:
      immich_default:
        aliases:
          - immich_server
          - immich-server
    depends_on:
      - redis
      - database

networks:
  immich_default:
    name: immich_default
    driver: bridge