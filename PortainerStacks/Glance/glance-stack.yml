# Glance dashboard + Glance Agent + Docker socket proxy.
# One self-contained file for both hosts (NedPi and the Brick). Portainer deploys it from Git.
# Per-host values come from the stack's environment variables in Portainer:
#   BIND_IP, LOCAL_NAME, PEER_NAME, PEER_URL, PEER_DOCKER, DISK_MOUNTPOINTS, AGENT_TOKEN,
#   WUD_ADMIN_USER, WUD_ADMIN_PASSWORD, PEER_WUD_ADDR
# Do NOT commit real values (especially AGENT_TOKEN and WUD_ADMIN_PASSWORD) to the repo.

services:
  glance:
    image: glanceapp/glance:latest
    container_name: glance
    restart: unless-stopped
    ports:
      - "${BIND_IP:?set BIND_IP}:8080:8080"
    configs:
      - source: glance_config
        target: /app/config/glance.yml
    depends_on:
      - agent
      - docker-proxy

  agent:
    image: glanceapp/agent:latest
    container_name: glance-agent
    restart: unless-stopped
    ports:
      # Reachable over the tailnet so the other host's Glance can read these stats
      - "${BIND_IP:?set BIND_IP}:27973:27973"
    volumes:
      # Read-only host mounts for disk stats; which ones show is set by DISK_MOUNTPOINTS
      - /:/host/root:ro
      - /var:/host/var:ro
      - /srv:/host/srv:ro
    environment:
      - "TOKEN=${AGENT_TOKEN:?set AGENT_TOKEN}"
      - "HIDE_MOUNTPOINTS_BY_DEFAULT=true"
      - "MOUNTPOINTS=${DISK_MOUNTPOINTS:?set DISK_MOUNTPOINTS}"

  docker-proxy:
    image: ghcr.io/tecnativa/docker-socket-proxy:latest
    container_name: glance-docker-proxy
    restart: unless-stopped
    ports:
      # Tailnet only: lets the other host's Glance list containers (read-only API)
      - "${BIND_IP:?set BIND_IP}:2375:2375"
    environment:
      # Allows the /containers API (read-only: POST stays off by default)
      - "CONTAINERS=1"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  wud:
    image: getwud/wud:latest
    container_name: wud
    restart: unless-stopped
    ports:
      # Tailnet only: WUD web UI and API (login required since WUD 9)
      - "${BIND_IP:?set BIND_IP}:3055:3000"
    environment:
      # Check registries once a day at 04:00
      - "WUD_WATCHER_LOCAL_CRON=0 4 * * *"
      # Docker Hub images on floating tags (latest) are only flagged via digest watching, which is off by default for Hub
      - "WUD_WATCHER_LOCAL_WATCHDIGESTDEFAULT=true"
      # WUD 9 refuses to start without an admin account
      - "WUD_AUTH_ADMIN_USER=${WUD_ADMIN_USER:?set WUD_ADMIN_USER}"
      - "WUD_AUTH_ADMIN_PASSWORD=${WUD_ADMIN_PASSWORD:?set WUD_ADMIN_PASSWORD}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

configs:
  glance_config:
    # Compose fills in the ${...} values below when the stack is deployed.
    content: |
      pages:
        - name: Home
          columns:
            - size: small
              widgets:
                - type: server-stats
                  title: Servers
                  servers:
                    - type: remote
                      name: "${LOCAL_NAME:?set LOCAL_NAME}"
                      url: http://agent:27973
                      token: "${AGENT_TOKEN:?set AGENT_TOKEN}"
                    - type: remote
                      name: "${PEER_NAME:?set PEER_NAME}"
                      url: "${PEER_URL:?set PEER_URL}"
                      token: "${AGENT_TOKEN:?set AGENT_TOKEN}"
                - type: custom-api
                  title: "Image updates: ${LOCAL_NAME:?set LOCAL_NAME}"
                  cache: 15m
                  url: "http://${WUD_ADMIN_USER:?set WUD_ADMIN_USER}:${WUD_ADMIN_PASSWORD:?set WUD_ADMIN_PASSWORD}@wud:3000/api/containers"
                  template: |
                    <ul class="list list-gap-10">
                      {{ range .JSON.Array "#(updateAvailable==true)#" }}
                        <li>
                          <div class="color-highlight">{{ .String "name" }}</div>
                          <div class="size-h6">{{ .String "image.name" }}:{{ .String "image.tag.value" }}</div>
                        </li>
                      {{ else }}
                        <li class="color-positive">All watched images are up to date</li>
                      {{ end }}
                    </ul>
                - type: custom-api
                  title: "Image updates: ${PEER_NAME:?set PEER_NAME}"
                  cache: 15m
                  url: "http://${WUD_ADMIN_USER:?set WUD_ADMIN_USER}:${WUD_ADMIN_PASSWORD:?set WUD_ADMIN_PASSWORD}@${PEER_WUD_ADDR:?set PEER_WUD_ADDR}/api/containers"
                  template: |
                    <ul class="list list-gap-10">
                      {{ range .JSON.Array "#(updateAvailable==true)#" }}
                        <li>
                          <div class="color-highlight">{{ .String "name" }}</div>
                          <div class="size-h6">{{ .String "image.name" }}:{{ .String "image.tag.value" }}</div>
                        </li>
                      {{ else }}
                        <li class="color-positive">All watched images are up to date</li>
                      {{ end }}
                    </ul>
            - size: full
              widgets:
                - type: docker-containers
                  title: "Containers on ${LOCAL_NAME:?set LOCAL_NAME}"
                  sock-path: tcp://docker-proxy:2375
                  format-container-names: true
                - type: docker-containers
                  title: "Containers on ${PEER_NAME:?set PEER_NAME}"
                  sock-path: "${PEER_DOCKER:?set PEER_DOCKER}"
                  format-container-names: true