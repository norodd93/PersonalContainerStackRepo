# Stack name in Portainer: webui
# Variables to set in Portainer: WEBUI_SECRET_KEY, OPENCODE_GO_KEY (optional)
# Requires the external Docker network "ai-net" and the ollama stack
services:
  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    restart: unless-stopped
    environment:
      - SEARXNG_BASE_URL=http://searxng:8080/
    volumes:
      - /home/norod/docker/ai/searxng:/etc/searxng:rw
    ports:
      - "127.0.0.1:8888:8080"
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID

  opencode-proxy:
    image: python:3.12-slim
    container_name: opencode-proxy
    restart: unless-stopped
    command: ["python", "-u", "/app/proxy.py"]
    environment:
      - OPENCODE_GO_KEY=${OPENCODE_GO_KEY}
      - PORT=9000
    volumes:
      - /home/norod/docker/ai/opencode-proxy:/app:ro
    expose:
      - "9000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9000/health').read()"]
      interval: 30s
      timeout: 5s
      retries: 3
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  open-web-ui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-web-ui
    restart: unless-stopped
    depends_on:
      - searxng
      - opencode-proxy
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - ENABLE_SIGNUP=false
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY}
      - WEBUI_URL=http://100.96.62.97:3001
      - ENABLE_WEB_SEARCH=true
      - WEB_SEARCH_ENGINE=searxng
      - SEARXNG_QUERY_URL=http://searxng:8080/search?q=<query>
      - WEB_SEARCH_RESULT_COUNT=3
      - WEB_SEARCH_CONCURRENT_REQUESTS=3
    volumes:
      - /home/norod/docker/ai/openwebui:/app/backend/data:rw
    ports:
      - "127.0.0.1:3001:8080"
      - "100.96.62.97:3001:8080"
    networks:
      - default
      - ai-net

networks:
  ai-net:
    external: true
